[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"
  SENTRY_SUPPRESS_INSTRUMENTATION_FILE_WARNING = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Declared here as well as in netlify/functions/job-worker.ts. The in-code `config` export
# is only honoured for v2 functions, and a regression to the v1 export shape would silently
# drop the schedule (this is exactly how extractions ended up stuck in "queued"). This
# declaration does not depend on the function's export shape.
[functions."job-worker"]
  schedule = "* * * * *"

# Headers (complementary to next.config.ts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
